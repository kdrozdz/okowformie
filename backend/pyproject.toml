[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kacper Drozdz", email = "kdrozdzdev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Aplikacja Django, nie biblioteka — nie instalujemy własnego pakietu do
# środowiska, `uv` zarządza tylko zależnościami. `manage.py` dokłada
# `src/` do sys.path.
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migracje są generowane przez Django (`makemigrations`), nie ręcznie
# formatowane, i nigdy nie są edytowane po wygenerowaniu.
"*/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
