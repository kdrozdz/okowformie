[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kacper Drozdz", email = "kdrozdzdev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-parler>=2.4",
    "django-prose-editor>=0.27.2",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.2",
    "langchain-xai>=1.3.0",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Aplikacja Django, nie biblioteka — nie instalujemy własnego pakietu do
# środowiska, `uv` zarządza tylko zależnościami. `manage.py` dokłada
# `src/` do sys.path.
package = false

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
# Ta sama zasada co niżej: pliku, którego nie wolno edytować, nie ma sensu
# formatować — inaczej `ruff format` i `.claude/settings.json` (`deny` na
# katalogu migracji) walczą ze sobą przy każdej nowej migracji.
exclude = ["*/migrations/*.py"]

[tool.ruff.lint.per-file-ignores]
# Migracje są generowane przez Django (`makemigrations`), nie ręcznie
# formatowane, i nigdy nie są edytowane po wygenerowaniu. Stąd też `I001`:
# Django wypisuje importy w swojej kolejności, a nie w kolejności isorta.
"*/migrations/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
# Bez pluginu django-stubs mypy nie rozumie ani `TextChoices`, ani
# querysetów, ani deskryptorów pól — a wtedy „mypy clean" nic nie znaczy.
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "backend.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
